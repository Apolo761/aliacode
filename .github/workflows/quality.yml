name: Cloud quality
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      base_url:
        description: Optional deployed URL to test
        required: false
permissions:
  contents: read
concurrency:
  group: cloud-quality-${{ github.ref }}-${{ inputs.base_url }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          BASE_URL: ${{ inputs.base_url }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist/
          retention-days: 14
  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Start Cloudflare build after quality checks
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          request = urllib.request.Request(os.environ['DEPLOY_HOOK'], method='POST')
          with urllib.request.urlopen(request, timeout=60) as response:
              result = json.load(response)
          if not result.get('success'):
              raise SystemExit('Cloudflare rejected the deployment trigger')
          print('Cloudflare build triggered successfully. Track completion in the Pages dashboard.')
          PY
